name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sim
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec next build apps/game --webpack

  contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contracts/world
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo test -- --test-threads=1
      - run: sudo apt-get install -y -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 pkg-config libudev-dev
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install cargo-near --version 0.22.0 --locked
      - run: cargo near build non-reproducible-wasm --skip-rust-version-check
