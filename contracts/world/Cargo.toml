[package]
name = "frontier-world"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"
borsh = "1.5.7"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
proptest = "1.6"
near-workspaces = { version = "0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
serde_json = "1"
sha2 = "0.10"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
strip = "debuginfo"

